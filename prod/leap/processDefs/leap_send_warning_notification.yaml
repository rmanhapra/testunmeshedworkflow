    input:
      script: "// (steps, context) will be provided as default inputs \n(steps, context) => {\n    const emailContent = `\n    \nHi Support Team,\n\nThis process id {{ context.input.__relatedProcessContext.process.id }} is running more than {{ context.input.timeout }} mins: {{context.input.__relatedProcessContext.process.name}}\n\nLink to Process: https://sg-unmesheduat.aiaazure.biz/app/processRuns/{{ context.input.__relatedProcessContext.process.id }}\n\nThe step that overrun is: {{ context.input.__relatedProcessContext.triggerStep.ref }} ({{ context.input.__relatedProcessContext.triggerStep.id }})\n\nPlease help to review job and:\n1.\tContinue to let it run\n2.\tKill/terminate job and force start it\n\n\nThanks and Regards,\n\nUnmeshed Automated\n\n(This is an automated notification, please do not reply to this email)\n    \n    `;\n\n    const emailSubject = `{{variables.ENV}} - Overrun Warning - ${context.input?.__relatedProcessContext?.process?.name || ''}`\n\n    return {\n        \"emailContent\" : emailContent,\n        \"emailSubject\": emailSubject\n    }\n}\n\nfunction formatJson(jsonObject) {\n  try {\n    if (typeof jsonObject !== \"object\" || jsonObject === null) {\n      return JSON.stringify(jsonObject);\n    }\n\n    // Sort the keys of the object\n    const sortedKeys = Object.keys(jsonObject).sort();\n\n    // Build the formatted string\n    const formattedString = sortedKeys\n      .map((key) => {\n        const value = jsonObject[key];\n        const stringifiedValue =\n          typeof value === \"object\" && value !== null\n            ? JSON.stringify(value)\n            : value === null\n            ? \"null\"\n            : typeof value === \"string\"\n            ? `\"${value}\"`\n            : value.toString();\n        return `${key}: ${stringifiedValue}`;\n      })\n      .join(\"\\n\");\n\n    return formattedString;\n  } catch (error) {\n    return JSON.stringify(jsonObject);\n  }\n}\n"
